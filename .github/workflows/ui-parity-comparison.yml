# Aurelis © 2026. GPL-3.0-or-later
name: "UI | BitChord and Aurelis comparison"
on:
  push:
    branches: [feature/bitchord-local-migration]
    paths:
      - .github/workflows/ui-parity-comparison.yml
      - .github/scripts/ui_parity*.py
      - .github/scripts/test_ui_parity.py
      - .github/scripts/fixtures/ui23-*.xml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ui-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  aurelis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Locate primary B01 APK from this exact commit
        id: primary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ui_parity_handoff.py resolve
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.primary.outputs.run_id }}
          name: ${{ steps.primary.outputs.artifact }}
          path: comparison-aurelis/ci-f3-handoff/
      - run: python3 .github/scripts/ui_parity_handoff.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-aurelis-${{ github.run_number }}
          path: comparison-aurelis/
          retention-days: 3
  settings-navigation:
    needs: aurelis
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    env:
      UI_SETTINGS_ANDROID_API: ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-aurelis-${{ github.run_number }}
          path: comparison-aurelis/
      - name: Restore both immutable B01 APKs
        run: |
          python3 .github/scripts/ui_parity_handoff.py restore
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Exercise both Settings entrances on the real Activity
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: '-no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none'
          script: python3 .github/scripts/ui_parity.py settings-navigation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Aurelis-Settings-Navigation-${{ github.run_number }}-api${{ matrix.api }}
          path: ci-ui-comparison/
          retention-days: 14
          if-no-files-found: error
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: kushagrasinghx/BitChord
          ref: b690dc146009d4815825fa4a20815ef2e4ee8898
          path: reference
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true
          validate-wrappers: true
      - name: Build unchanged reference app without bundled watch APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p comparison-reference
          test "$(git -C reference rev-parse HEAD)" = b690dc146009d4815825fa4a20815ef2e4ee8898
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" 2>&1 | tee comparison-reference/sdk.log
          cd reference
          bash gradlew :app:assembleProdDebug -Pbitchord.bundleWear=false --console=plain --max-workers=2 --no-daemon 2>&1 | tee ../comparison-reference/build.log
          cd ..
          git -C reference diff --exit-code
          python3 .github/scripts/ui_parity.py select-reference reference/app/build/outputs/apk/prod/debug comparison-reference
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-reference-${{ github.run_number }}
          path: comparison-reference/
          retention-days: 3
  compare:
    needs: [aurelis, reference]
    strategy:
      fail-fast: false
      matrix:
        material: [plain, glass]
    env:
      UI_COMPARISON_MATERIAL: ${{ matrix.material }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-aurelis-${{ github.run_number }}
          path: comparison-aurelis/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-reference-${{ github.run_number }}
          path: comparison-reference/
      - name: Verify immutable Aurelis APK and prepare original media
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ui_parity_handoff.py restore
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          python3 -m unittest discover -s .github/scripts -p test_ui_parity.py -v
          python3 .github/scripts/ui_parity_fixtures.py comparison-media
          mkdir -p ci-ui-comparison
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Capture both real apps under identical device conditions
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: '-no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none'
          script: python3 .github/scripts/ui_parity.py capture
      - name: Preserve host diagnostics after emulator exit
        if: always()
        shell: bash
        run: |
          mkdir -p ci-ui-comparison/host
          free -m > ci-ui-comparison/host/memory.txt
          df -h > ci-ui-comparison/host/disk.txt
          ps -eo pid,ppid,stat,rss,comm > ci-ui-comparison/host/processes.txt
          sudo dmesg --ctime |& tee ci-ui-comparison/host/kernel.txt > /dev/null || true
          grep -Ei 'out of memory|oom-kill|killed process|segfault|trap' ci-ui-comparison/host/kernel.txt || true
      - name: Build comparison gallery without claiming visual equivalence
        if: always()
        run: python3 .github/scripts/ui_parity.py report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Aurelis-BitChord-UI-${{ github.run_number }}-${{ matrix.material }}
          path: ci-ui-comparison/
          retention-days: 14
          if-no-files-found: error
