# B03: independent compilation/tests plus Android16 navigation using B01 APKs.
# No APK is built or published by the runtime step.
name: "B03 | Android Unit Tests"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurelis-b03-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: "B03 | Debug + Release unit tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create isolated report directory
        run: mkdir -p ci-b03/junit/debug ci-b03/junit/release

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/feature/bitchord-local-migration' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch') }}

      - name: Cache fixed-version Android SDK components
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
            ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-v1-${{ runner.os }}-api36-bt35-ndk26.1.10909125-cmake3.22.1

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > ci-b03/sdk-install.log 2>&1 || {
            cat ci-b03/sdk-install.log
            exit 1
          }
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          chmod +x gradlew

      - name: Compile Debug unit tests before execution
        id: compile_debug
        continue-on-error: true
        run: |
          bash .github/scripts/b03-phase.sh compile-debug ./gradlew \
            :app:compileDebugUnitTestKotlin :app:compileDebugUnitTestJavaWithJavac \
            --init-script .github/scripts/task-inputs.gradle --build-cache --console=plain \
            --stacktrace --no-configuration-cache --max-workers=2

      - name: Compile Release unit tests independently
        id: compile_release
        if: ${{ !cancelled() && steps.compile_debug.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          bash .github/scripts/b03-phase.sh compile-release ./gradlew \
            :app:compileReleaseUnitTestKotlin :app:compileReleaseUnitTestJavaWithJavac \
            --init-script .github/scripts/task-inputs.gradle --build-cache --console=plain \
            --stacktrace --no-configuration-cache --max-workers=2

      - name: Run Debug unit tests
        id: debug
        if: ${{ !cancelled() && steps.compile_debug.outcome == 'success' }}
        continue-on-error: true
        run: |
          bash .github/scripts/b03-phase.sh debug ./gradlew :app:testDebugUnitTest \
            --init-script .github/scripts/task-inputs.gradle --init-script .github/scripts/b03-test-diagnostics.gradle \
            --build-cache --console=plain --stacktrace --no-configuration-cache --max-workers=2

      - name: Run Release unit tests independently
        id: release
        if: ${{ !cancelled() && steps.compile_release.outcome == 'success' }}
        continue-on-error: true
        run: |
          bash .github/scripts/b03-phase.sh release ./gradlew :app:testReleaseUnitTest \
            --init-script .github/scripts/task-inputs.gradle --init-script .github/scripts/b03-test-diagnostics.gradle \
            --build-cache --console=plain --stacktrace --no-configuration-cache --max-workers=2

      - name: Generate Kover Debug and Release XML coverage
        id: coverage
        if: ${{ steps.debug.outcome == 'success' && steps.release.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ./gradlew :app:koverXmlReportDebug :app:koverXmlReportRelease --console=plain --max-workers=2 \
            --no-configuration-cache 2>&1 | tee ci-b03/kover.log
          mkdir -p ci-b03/coverage
          find app/build/reports/kover -type f -name '*.xml' -exec cp --parents {} ci-b03/coverage/ \;
          test -n "$(find ci-b03/coverage -type f -name '*.xml' -print -quit)"

      - name: Assess changed-line Kover coverage (fail closed on unknown provenance)
        id: diff_coverage
        if: always()
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_f5_diff_coverage.py' -v
          python3 .github/scripts/f5_diff_coverage.py --base origin/main             --reports ci-b03/coverage --output ci-b03/diff-coverage.json

      - name: Enforce F5 changed-line coverage threshold on the source diff
        id: f5_coverage_gate
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_f5_coverage_gate.py' -v
          python3 .github/scripts/f5_coverage_gate.py ci-b03/diff-coverage.json

      - name: Download identical B01 APKs for Android16 navigation
        id: android16_apks
        if: ${{ !cancelled() && steps.compile_debug.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: b01-shared-apks-${{ github.run_number }}
          path: ci-f3-handoff/

      - name: Verify immutable APK handoff and prepare emulator access
        id: android16_handoff
        if: ${{ !cancelled() && steps.android16_apks.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 .github/scripts/ci14_handoff.py restore --variant all
          python3 .github/scripts/ci14_handoff.py verify
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Release idle Gradle daemons before Android16 emulator
        if: ${{ !cancelled() && steps.android16_handoff.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p ci-b03/android16
          ./gradlew --stop 2>&1 | tee ci-b03/android16/gradle-daemon-stop.log
          free -m | tee ci-b03/android16/host-memory-before-emulator.txt

      - name: Exercise real Activity recreation and playback on Android16
        id: android16
        if: ${{ !cancelled() && steps.android16_handoff.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 25
        env:
          UI_SETTINGS_ANDROID_API: '36'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: '-no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none'
          script: python3 .github/scripts/ui_parity.py settings-navigation

      - name: Verify B03 report classification and failure gates
        if: always()
        run: python3 -m unittest discover -s .github/scripts -p 'test_b03_test_summary.py' -v

      - name: Summarize compilation JUnit and Android16 evidence
        if: always()
        env:
          COMPILE_DEBUG_OUTCOME: ${{ steps.compile_debug.outcome }}
          COMPILE_RELEASE_OUTCOME: ${{ steps.compile_release.outcome }}
          DEBUG_OUTCOME: ${{ steps.debug.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          ANDROID16_OUTCOME: ${{ steps.android16.outcome }}
        run: python3 .github/scripts/b03_test_summary.py

      - name: Upload Debug test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: b03-debug-tests-${{ github.run_number }}
          overwrite: true
          path: |
            ci-b03/compile-debug.log
            ci-b03/debug.log
            ci-b03/junit/debug/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: b03-release-tests-${{ github.run_number }}
          overwrite: true
          path: |
            ci-b03/compile-release.log
            ci-b03/release.log
            ci-b03/junit/release/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload B03 aggregate summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: b03-summary-${{ github.run_number }}
          overwrite: true
          path: |
            ci-b03/summary.md
            ci-b03/results.json
            ci-b03/test-cases.tsv
            ci-b03/sdk-install.log
            ci-b03/diff-coverage.json
            ci-b03/kover.log
            ci-b03/coverage/
            ci-b03/android16/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce both test suites and Android16 navigation
        if: always()
        run: python3 .github/scripts/b03_test_summary.py --gate
