# B06: one push -> ordered, independently reported CI stages.
name: "Aurelis | Unified B01-B06 Pipeline"

on:
  push:
    branches:
      - feature/bitchord-local-migration
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "LICENSE"
      - "LICENSES/**"
      - "NOTICE"
      - ".github/scripts/**"
      - ".github/apk-audit-policy.json"
      - ".github/workflows/b0*.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aurelis-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  b01:
    name: "B01 | Compile Debug APK"
    uses: ./.github/workflows/b01-compile-debug.yml
    permissions:
      contents: read

  b02:
    name: "B02 | Android Lint"
    needs: b01
    if: ${{ needs.b01.result == 'success' }}
    uses: ./.github/workflows/b02-android-lint.yml
    permissions:
      contents: read

  b03:
    name: "B03 | Unit Tests"
    needs: b02
    if: ${{ needs.b02.result == 'success' }}
    uses: ./.github/workflows/b03-unit-tests.yml
    permissions:
      contents: read

  b04:
    name: "B04 | APK Verification"
    needs: b03
    if: ${{ needs.b03.result == 'success' }}
    uses: ./.github/workflows/b04-verify-apks.yml
    secrets: inherit
    permissions:
      contents: read

  b05:
    name: "B05 | Android Emulator"
    needs: b04
    if: ${{ needs.b04.result == 'success' }}
    uses: ./.github/workflows/b05-android-emulator.yml
    permissions:
      contents: read

  b06:
    name: "B06 | Reports and final gate"
    needs: [b01, b02, b03, b04, b05]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout report bundling script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Collect all B01-B05 artifacts (if any)
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a # v4
        with:
          pattern: "b0*"
          path: b06-input/
          merge-multiple: false

      - name: Test VirusTotal report logic without network
        run: python3 -m unittest discover -s .github/scripts -p 'test_b06_virustotal_delivery.py' -v

      - name: Test P2.4 per-file report matrix without network
        run: python3 -m unittest discover -s .github/scripts -p 'test_b06_file_matrix.py' -v

      - name: Test P2.5 VirusTotal packaging and artifact contract offline
        run: python3 -m unittest discover -s .github/scripts -p 'test_b06_delivery_contract.py' -v

      - name: Consolidate B01-B06 reports into one phase-organized package
        id: summary
        if: always()
        env:
          STAGES_JSON: ${{ toJSON(needs) }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: python3 .github/scripts/b06_bundle_reports.py

      - name: Upload B06 final report
        id: upload
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Aurelis-Informes-B01-B06-${{ github.run_number }}
          path: b06-package/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce all phases and report publication
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          file = Path("b06-package/B06/pipeline-results.json")
          if not file.is_file():
              raise SystemExit("B06 FAIL: missing final report")
          result = json.loads(file.read_text())
          if result["status"] != "PASS" or os.getenv("SUMMARY_OUTCOME") != "success" or os.getenv("UPLOAD_OUTCOME") != "success":
              bad = ", ".join(k + "=" + v for k, v in result["phases"].items() if v != "success")
              failed_checks = [name for name, ok in result.get("checks", {}).items() if ok is not True]
              reason = "; ".join(x for x in (bad, "failed checks: " + ", ".join(failed_checks) if failed_checks else "") if x)
              raise SystemExit("B06 FAIL: " + (reason or "report gate or upload failed"))
          print("B06 PASS: B01-B05 verified, one organized report artifact published")
          PY

      - name: Retain only 3 final artifacts after successful B06 gate
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/b06_cleanup_artifacts.py
