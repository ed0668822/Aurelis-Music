name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > aurelis-release.jks
            echo "Keystore decoded: $(ls -la aurelis-release.jks)"
          else
            echo "::warning::KEYSTORE_BASE64 no configurado. Se firmará con la clave debug."
          fi

      - name: Run unit tests (if any)
        env:
          STORE_FILE:        "aurelis-release.jks"
          STORE_PASSWORD:    ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_FILE:        "aurelis-release.jks"
          STORE_PASSWORD:    ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK exists and is not empty
        run: |
          set -e
          APK_DIR="app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Directorio de salida no existe: $APK_DIR"
            ls -la app/build/outputs/ || true
            exit 1
          fi
          APK=$(ls "$APK_DIR"/*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then
            echo "::error::No se generó ningún APK en $APK_DIR"
            ls -la "$APK_DIR" || true
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::El APK pesa menos de 1 MB ($SIZE bytes). Algo falló."
            exit 1
          fi
          ls -la "$APK_DIR"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelis-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
