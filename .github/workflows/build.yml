# Aurelis © 2026. GPL-3.0-or-later.
name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# AÑADIDO: Permisos necesarios para que Reviewdog pueda comentar en los PRs
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # AÑADIDO: Necesario para que Reviewdog compare diferencias en el PR

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > aurelis-release.jks
            echo "Keystore decoded: $(ls -la aurelis-release.jks)"
          else
            echo "::warning::KEYSTORE_BASE64 no configurado. Se firmará con la clave debug."
          fi

      - name: Run Android Lint
        # Ejecutamos Lint para generar el XML. continue-on-error evita que el workflow muera aquí si hay warnings.
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Run Reviewdog with Android Lint
        # Reviewdog leerá el XML de Lint y comentará los errores directamente en el PR.
        uses: reviewdog/action-setup@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -f=checkstyle: formato del XML de Lint
          # -reporter=github-pr-review: comenta en el PR (o en el commit si es un push directo)
          reviewdog -f=checkstyle \
            -reporter=github-pr-review \
            -level=warning \
            -filter-mode=added \
            -fail-on-error=false \
            < app/build/reports/lint-results-debug.xml

      - name: Run unit tests (if any)
        env:
          STORE_FILE:        "aurelis-release.jks"
          STORE_PASSWORD:    ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        # AÑADIDO: tee guarda la salida en build.log mientras se muestra en consola
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build-tests.log

      - name: Build Release APK
        env:
          STORE_FILE:        "aurelis-release.jks"
          STORE_PASSWORD:    ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        # AÑADIDO: tee guarda la salida en build-release.log
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log

      - name: Verify APK exists and is not empty
        if: success() # Solo verifica si el build de release fue exitoso
        run: |
          set -e
          APK_DIR="app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Directorio de salida no existe: $APK_DIR"
            ls -la app/build/outputs/ || true
            exit 1
          fi
          APK=$(ls "$APK_DIR"/*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then
            echo "::error::No se generó ningún APK en $APK_DIR"
            ls -la "$APK_DIR" || true
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::El APK pesa menos de 1 MB ($SIZE bytes). Algo falló."
            exit 1
          fi
          ls -la "$APK_DIR"

      - name: Inspect APK Contents (apkanalyzer)
        if: success()
        # Este paso te dice EXACTAMENTE qué clases y recursos se compilaron y entraron en el APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          
          # Buscamos apkanalyzer dinámicamente en las herramientas de Android
          APK_ANALYZER=$(find $ANDROID_HOME -name apkanalyzer | head -n 1)
          
          if [ -z "$APK_ANALYZER" ]; then
            echo "::warning::No se encontró apkanalyzer. Saltando análisis."
            exit 0
          fi

          echo "====================================================="
          echo "📦 RESUMEN DE ARCHIVOS COMPILADOS EN EL APK"
          echo "====================================================="
          echo "--- Clases Kotlin/Java incluidas (Top 50) ---"
          $APK_ANALYZER dex packages "$APK" | grep -E "^C" | head -n 50 || echo "No hay clases o falló el comando."
          
          echo ""
          echo "--- Archivos de Recursos (layouts, drawables, etc.) incluidos ---"
          $APK_ANALYZER resources packages "$APK" | head -n 50 || echo "No hay recursos o falló el comando."
          echo "====================================================="

      - name: Upload Build Logs (on Failure)
        # Si algo falla, sube los logs para que puedas ver el error exacto archivo por archivo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ github.run_number }}
          path: |
            build-tests.log
            build-release.log
            app/build/reports/lint-results-debug.xml
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aurelis-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
