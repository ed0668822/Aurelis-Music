# Aurelis © 2026. GPL-3.0-or-later.
name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > aurelis-release.jks
            echo "Keystore decoded: $(ls -la aurelis-release.jks)"
          else
            echo "::warning::KEYSTORE_BASE64 no configurado. Se firmará con la clave debug."
          fi

      # ──────────────────────────────────────────────────────────────
      # Preinstalar NDK con reintentos (evita el fallo de zip corrupto
      # y el "Broken pipe" del comando `yes`)
      # ──────────────────────────────────────────────────────────────
      - name: Install NDK (robust, with retries)
        shell: bash
        run: |
          set -e
          NDK_VERSION="27.0.12077973"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_DIR="${SDK_DIR}/ndk/${NDK_VERSION}"
          SDKMANAGER="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"

          if [ -d "$NDK_DIR" ] && [ -f "$NDK_DIR/source.properties" ]; then
            echo "✅ NDK ${NDK_VERSION} already installed at ${NDK_DIR}"
            ls -la "$NDK_DIR" | head -20
            exit 0
          fi

          echo "📦 Installing NDK ${NDK_VERSION} (with retries)…"

          echo "── Accepting SDK licenses ──"
          ( set +o pipefail; yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 ) || true

          for attempt in 1 2 3; do
            echo "── Attempt ${attempt}/3 ──"
            rm -rf "${SDK_DIR}/.temp" "${SDK_DIR}/.downloadIntermediates" 2>/dev/null || true

            "$SDKMANAGER" --install "ndk;${NDK_VERSION}" > /tmp/sdkmanager-ndk.log 2>&1 || true

            if [ -d "$NDK_DIR" ] && [ -f "$NDK_DIR/source.properties" ]; then
              SIZE=$(du -sm "$NDK_DIR" 2>/dev/null | awk '{print $1}')
              if [ -n "$SIZE" ] && [ "$SIZE" -ge 500 ]; then
                echo "✅ NDK installed successfully on attempt ${attempt} (${SIZE} MB)"
                ls -la "$NDK_DIR" | head -20
                exit 0
              else
                echo "⚠️  NDK directory exists but looks incomplete (${SIZE:-0} MB). Will retry."
              fi
            fi

            echo "⚠️  Attempt ${attempt} failed, retrying in 10s…"
            tail -n 30 /tmp/sdkmanager-ndk.log 2>/dev/null || true
            sleep 10
          done

          echo "::error::Failed to install NDK ${NDK_VERSION} after 3 attempts."
          cat /tmp/sdkmanager-ndk.log 2>/dev/null || true
          exit 1

      # ──────────────────────────────────────────────────────────────
      # 1. Lint (informativo — no bloquea el build)
      # ──────────────────────────────────────────────────────────────
      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Setup Reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Report Android Lint Results
        if: hashFiles('app/build/reports/lint-results-debug.xml') != ''
        uses: ilyagulya/android-lint-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint_xml_file: app/build/reports/lint-results-debug.xml
          reporter: github-pr-check
          level: warning

      # ──────────────────────────────────────────────────────────────
      # 2. Tests unitarios
      # ──────────────────────────────────────────────────────────────
      - name: Run unit tests
        env:
          STORE_FILE:        "aurelis-release.jks"
          STORE_PASSWORD:    ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build-tests.log

      # ──────────────────────────────────────────────────────────────
      # 3. Build Release
      # ──────────────────────────────────────────────────────────────
      - name: Build Release APK
        id: build
        continue-on-error: true
        env:
          STORE_FILE:        "aurelis-release.jks"
          STORE_PASSWORD:    ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        shell: bash
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log
          exit ${PIPESTATUS[0]}

      # ──────────────────────────────────────────────────────────────
      # 4. Inventario de fuentes
      # ──────────────────────────────────────────────────────────────
      - name: Generate Source Inventory
        if: always()
        shell: bash
        run: |
          kt=$(find app/src -type f -name "*.kt" | wc -l)
          java=$(find app/src -type f -name "*.java" | wc -l)
          cpp=$(find app/src -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) | wc -l)
          xml=$(find app/src/main/res -type f -name "*.xml" | wc -l)
          {
            echo "## 📦 Inventario de archivos fuente"
            echo ""
            echo "| Tipo | Cantidad |"
            echo "|------|----------|"
            echo "| Kotlin (.kt) | $kt |"
            echo "| Java (.java) | $java |"
            echo "| C/C++ (.c/.cpp/.h/.hpp) | $cpp |"
            echo "| Recursos XML | $xml |"
            echo ""
            echo "**Total fuente (Kotlin+Java+C/C++):** $((kt + java + cpp))"
          } >> $GITHUB_STEP_SUMMARY
          find app/src -type f \( -name "*.kt" -o -name "*.java" -o -name "*.c" -o -name "*.cpp" -o -name "*.h" \) | sort > source-inventory.txt

      # ──────────────────────────────────────────────────────────────
      # 5. Reporte per-file
      # ──────────────────────────────────────────────────────────────
      - name: Generate Per-File Compilation Report
        if: always()
        shell: bash
        run: |
          grep -E '^e: file://' build-release.log 2>/dev/null \
            | sed -E 's|^e: file://[^:]*/app/src|app/src|' \
            | sed -E 's|:[0-9]+:[0-9]+ | |' > errors.txt || true
          grep -E '^w: file://' build-release.log 2>/dev/null \
            | sed -E 's|^w: file://[^:]*/app/src|app/src|' \
            | sed -E 's|:[0-9]+:[0-9]+ | |' > warnings.txt || true

          if [ "${{ steps.build.outcome }}" != "success" ]; then
            grep -A 8 "What went wrong" build-release.log 2>/dev/null | head -n 15 > failure-reason.txt || true
            grep -A 3 "FAILURE: Build failed" build-release.log 2>/dev/null | head -n 5 >> failure-reason.txt || true
          fi

          ok_count=0; warn_count=0; err_count=0
          : > file-status.txt
          while IFS= read -r file; do
            relpath="${file#./}"
            if grep -qF "${relpath} " errors.txt 2>/dev/null; then
              msg=$(grep -F "${relpath} " errors.txt | head -n1 | sed "s|^${relpath} ||")
              echo "❌ ERROR     ${relpath}" >> file-status.txt
              echo "             ↳ ${msg}" >> file-status.txt
              err_count=$((err_count + 1))
            elif grep -qF "${relpath} " warnings.txt 2>/dev/null; then
              msg=$(grep -F "${relpath} " warnings.txt | head -n1 | sed "s|^${relpath} ||")
              echo "⚠️  WARNING   ${relpath}" >> file-status.txt
              echo "             ↳ ${msg}" >> file-status.txt
              warn_count=$((warn_count + 1))
            else
              echo "✅ OK        ${relpath}" >> file-status.txt
              ok_count=$((ok_count + 1))
            fi
          done < <(find app/src -type f \( -name "*.kt" -o -name "*.java" \) | sort)

          {
            echo ""
            echo "## 🧪 Estado de compilación por archivo"
            echo ""
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "**Resultado:** ✅ Compilación exitosa — APK generado."
            else
              echo "**Resultado:** ❌ Compilación fallida — sin APK."
              echo ""
              echo "<details><summary>Razón del fallo</summary>"
              echo ""
              echo '```'
              cat failure-reason.txt 2>/dev/null || echo "(sin detalle)"
              echo '```'
              echo "</details>"
            fi
            echo ""
            echo "| Estado | Archivos |"
            echo "|--------|---------:|"
            echo "| ✅ OK (compilaron limpio) | **$ok_count** |"
            echo "| ⚠️ WARNING (compilaron con advertencias) | **$warn_count** |"
            echo "| ❌ ERROR (fallaron) | **$err_count** |"
            echo ""
            echo "### Detalle por archivo"
            echo ""
            echo '```'
            head -n 400 file-status.txt
            echo '```'
            if [ $(wc -l < file-status.txt) -gt 400 ]; then
              echo "_...reporte truncado. Descarga el artefacto \`compilation-report-${{ github.run_number }}\` para ver el completo._"
            fi
          } >> $GITHUB_STEP_SUMMARY

          {
            echo "# Reporte de compilación — Aurelis Music"
            echo ""
            echo "**Run:** #${{ github.run_number }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Estado:** ${{ steps.build.outcome }}"
            echo ""
            echo "## Resumen"
            echo "- ✅ OK: $ok_count"
            echo "- ⚠️ WARNING: $warn_count"
            echo "- ❌ ERROR: $err_count"
            echo ""
            if [ -s failure-reason.txt ]; then
              echo "## Razón del fallo"
              echo ""
              cat failure-reason.txt
              echo ""
            fi
            echo "## Estado por archivo"
            echo ""
            cat file-status.txt
            echo ""
            echo "## Errores completos"
            echo ""
            cat errors.txt
            echo ""
            echo "## Warnings completos"
            echo ""
            cat warnings.txt
          } > compilation-report.txt

      # ──────────────────────────────────────────────────────────────
      # 6. Verificar APK
      # ──────────────────────────────────────────────────────────────
      - name: Verify APK exists and is not empty
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -e
          APK_DIR="app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Directorio no existe: $APK_DIR"
            exit 1
          fi
          shopt -s nullglob
          APKS=("$APK_DIR"/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No se generó ningún APK"
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            SIZE=$(stat -c%s "$APK")
            echo "APK: $APK ($SIZE bytes)"
            if [ "$SIZE" -lt 1000000 ]; then
              echo "::error::APK demasiado pequeño: $APK"
              exit 1
            fi
          done

      # ──────────────────────────────────────────────────────────────
      # 7. Inspeccionar APK
      # ──────────────────────────────────────────────────────────────
      - name: Inspect APK Contents (apkanalyzer)
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          APK_ANALYZER=$(find $ANDROID_HOME -name apkanalyzer | head -n1)
          if [ -z "$APK_ANALYZER" ]; then
            echo "::warning::apkanalyzer no encontrado"; exit 0
          fi
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          : > apk-contents.txt
          {
            echo ""
            echo "## 📲 APK generado"
            echo ""
            echo "| Archivo | Tamaño |"
            echo "|---------|--------|"
          } >> $GITHUB_STEP_SUMMARY
          for APK in "${APKS[@]}"; do
            NAME=$(basename "$APK")
            SIZE=$(stat -c%s "$APK")
            echo "| \`$NAME\` | $SIZE bytes |" >> $GITHUB_STEP_SUMMARY
            echo "=== $NAME ===" >> apk-contents.txt
            $APK_ANALYZER dex packages "$APK" >> apk-contents.txt 2>&1 || true
          done

      # ──────────────────────────────────────────────────────────────
      # 8. Subir artefactos
      # ──────────────────────────────────────────────────────────────
      - name: Upload Compilation Report (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-report-${{ github.run_number }}
          path: |
            compilation-report.txt
            file-status.txt
            errors.txt
            warnings.txt
            source-inventory.txt
            build-release.log
            failure-reason.txt
            apk-contents.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK (solo si compiló bien)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Aurelis Music-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # ──────────────────────────────────────────────────────────────
      # 9. Marcar workflow fallido
      # ──────────────────────────────────────────────────────────────
      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::La compilación falló. Descarga el artefacto 'compilation-report-${{ github.run_number }}' para el detalle per-file."
          exit 1
