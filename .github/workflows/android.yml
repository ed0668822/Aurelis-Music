name: Android

# Compila Debug y Release en un solo trabajo y entrega las APK por separado:
# - Se reutilizan checkout, JDK, SDK opcional, runner y cache Gradle.
# - La APK Debug se publica antes de validar la firma de Release.
# - Las regresiones y Lint se ejecutan despues, en B13.
#   - aurelis-prueba-debug      APK dev/debug de PRUEBA (clave de depuración)
#   - aurelis-firmado-release   APK prod/release FIRMADO con tu clave
#
# El firmado necesita estos secrets del repo (Settings > Secrets and variables
# > Actions): KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Opcionales: LASTFM_API_KEY, LASTFM_SECRET, LISTEN_TOGETHER_SERVER.
on:
  push:
    branches: [main, Aurelis-Music-Redesign]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Una APK por variante, solo ARM64, sin APK universal.
  ABIS: arm64-v8a

jobs:
  compilacion:
    name: Compilación (Debug + Release)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
    steps:
      - uses: actions/checkout@v6

      - name: Retrieve official Discord Android SDK from private release (optional)
        env:
          GH_TOKEN: ${{ secrets.DISCORD_SDK_READ_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice title=Discord SDK::Private SDK token not configured; compiling without optional Discord presence."
          else
            mkdir -p app/libs
            # Do not leave a partial or unverified native library behind.
            rm -f app/libs/discord_partner_sdk.aar
            if gh release download v1.11.24259 --repo ed0668822/Aurelis-Discord-SDK --pattern discord_partner_sdk.aar --dir app/libs; then
              if printf '%s  %s\n' 'ea4c080cc7c5ddeccab58f3bdf5682a3e18a7a84a815bb0f33609bfcafba3f99' 'app/libs/discord_partner_sdk.aar' | sha256sum --check --status; then
                echo "Official Discord SDK AAR: SHA-256 verified."
              else
                rm -f app/libs/discord_partner_sdk.aar
                echo "::warning title=Discord SDK::Downloaded AAR failed integrity validation; optional integration disabled for this build."
              fi
            else
              rm -f app/libs/discord_partner_sdk.aar
              echo "::warning title=Discord SDK::Private release could not be downloaded; optional integration disabled for this build."
            fi
          fi

      - name: Validate official Discord SDK AAR (optional)
        run: bash scripts/install-discord-sdk.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # La rama activa no es la predeterminada; sin esto la caché era
          # de solo lectura y cada build recompilaba más de lo necesario.
          cache-read-only: false

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          printf 'LASTFM_API_KEY=%s\nLASTFM_SECRET=%s\nLISTEN_TOGETHER_SERVER=%s\n' \
            "$LASTFM_API_KEY" "$LASTFM_SECRET" "$LISTEN_TOGETHER_SERVER" > local.properties

      - run: chmod +x gradlew

      # Compilar primero: aunque fallen los tests, el APK de prueba queda
      # disponible como artefacto independiente para diagnostico.
      - name: Validate identity and build debug APK
        run: ./gradlew :app:verifyAurelisBuildIdentity :app:assembleDevDebug --build-cache -Paurelis.abis="$ABIS" -Paurelis.bundleWear=false -Paurelis.buildNumber="$GITHUB_RUN_NUMBER"

      - name: APK size report
        run: |
          cd app/build/outputs/apk/dev/debug
          ls -l --block-size=M *.apk
          echo "APKs generados: $(ls *.apk | wc -l)"

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: aurelis-prueba-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          # Los APK ya están comprimidos; recomprimirlos retrasa su entrega.
          compression-level: 0

      # Falla antes de compilar si falta la firma.
      - name: Check signing secrets
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Falta la firma::Crea estos secrets en el repo:$missing"
            exit 1
          fi


      - name: Write signing files
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > aurelis-release.jks
          printf 'storeFile=aurelis-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      # Comprueba que el keystore, la contraseña y el alias son correctos.
      - name: Validate keystore
        run: |
          keytool -list -keystore aurelis-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error title=Firma inválida::El keystore, la contraseña o el alias no coinciden"; exit 1; }
          echo "Keystore OK"

      - name: Build signed prod release APK
        run: ./gradlew :app:assembleProdRelease --profile --build-cache -Paurelis.abis="$ABIS" -Paurelis.bundleWear=false -Paurelis.buildNumber="$GITHUB_RUN_NUMBER"

      # Falla si el APK quedó sin firmar o si apksigner no lo da por válido.
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cd app/build/outputs/apk/prod/release
          ls -l --block-size=M *.apk
          for APK in *.apk; do
            echo "=== $APK ==="
            case "$APK" in
              *unsigned*) echo "::error title=Sin firmar::$APK no está firmado"; exit 1 ;;
            esac
            if ! out=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1); then
              echo "$out"
              echo "::error title=Firma inválida::apksigner no verifica $APK"
              exit 1
            fi
            echo "$out" | grep -iE "^Verifies|Verified using|certificate (DN|SHA-256)" || true
            sha256sum "$APK"
          done

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: aurelis-firmado-release
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Remove signing files
        if: always()
        run: rm -f aurelis-release.jks keystore.properties local.properties

      - name: Upload release Gradle profile
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: aurelis-perfil-gradle-release
          path: build/reports/profile/
          if-no-files-found: ignore

  estabilidad:
    name: B13 | Lint y pruebas adicionales
    needs: [compilacion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Write optional local integration settings
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          printf 'LASTFM_API_KEY=%s\nLASTFM_SECRET=%s\nLISTEN_TOGETHER_SERVER=%s\n' \
            "$LASTFM_API_KEY" "$LASTFM_SECRET" "$LISTEN_TOGETHER_SERVER" > local.properties
          chmod +x gradlew

      - name: TV06 | Check browser TV receiver JavaScript
        run: python3 scripts/verify_webtv_receiver.py

      # Run app, shared planner/LoopMix and sharedUi JVM tests, Android Lint and instrumentation compilation in one
      # Gradle invocation. --continue collects every failing task/report before
      # the final CI verdict rather than hiding later regressions.
      - name: B13 | JVM tests, Lint, instrumentation APK
        id: b13_checks
        continue-on-error: true
        run: |
          ./gradlew \
            :app:testDevDebugUnitTest \
            :shared:jvmTest \
            :sharedUi:jvmTest \
            :app:testProdReleaseUnitTest \
            :app:lintDevDebug \
            :app:assembleDevDebugAndroidTest \
            --continue --build-cache \
            -Paurelis.abis="$ABIS" \
            -Paurelis.bundleWear=false \
            -Paurelis.buildNumber="$GITHUB_RUN_NUMBER"

      - name: B20 | Validate lyrics sharing translations
        run: python3 scripts/verify_b20_locales.py

      - name: Upload stability reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aurelis-informes-b13
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/test-results/testDevDebugUnitTest/
            app/build/reports/tests/testDevDebugUnitTest/
            app/build/test-results/testProdReleaseUnitTest/
            app/build/reports/tests/testProdReleaseUnitTest/
            sharedUi/build/test-results/jvmTest/
            sharedUi/build/reports/tests/jvmTest/
            shared/build/test-results/jvmTest/
            shared/build/reports/tests/jvmTest/
          if-no-files-found: ignore

      # Keep the full Lint report and complete instrumented-test compilation
      # before reporting unresolved Lint issues as a failing CI job.
      - name: Fail on unresolved B13 Gradle checks
        if: always() && steps.b13_checks.outcome == 'failure'
        run: |
          echo "::error title=B13 Gradle checks::At least one unit test, Android Lint task, or instrumentation compilation failed. See aurelis-informes-b13."
          exit 1
