name: Android

# Compila solo la app de Android (variante dev/debug). No necesita keystore ni
# secrets de firma: AGP genera una clave de depuración propia.
on:
  push:
    branches: [Aurelis-Music-Redesign]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dev APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Las claves de Last.fm y Listen Together son opcionales: si no existen
      # como secrets del repo quedan vacías y la app compila igual.
      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      - run: chmod +x gradlew

      # El módulo del reloj ya no existe aquí, así que no se empaqueta.
      - name: Build the dev APK
        run: ./gradlew assembleDevDebug -Pbitchord.bundleWear=false

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelis-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
