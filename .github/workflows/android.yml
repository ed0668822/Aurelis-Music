# Aurelis © 2026. GPL-3.0-or-later.
name: Build Release APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Native workflow annotations and summaries require no PR/issue write token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record source and comparison commits
        id: init
        continue-on-error: true
        env:
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/android_ci.py prepare

      - name: Validate CI helpers (no Android compilation)
        id: helpers
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        continue-on-error: true
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Set up JDK 17
        id: java
        if: ${{ !cancelled() && steps.helpers.outcome == 'success' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, Node 24
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate wrapper and configure Gradle cache
        id: gradle
        if: ${{ !cancelled() && steps.java.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5, Node 24
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify Android toolchain
        id: android
        if: ${{ !cancelled() && steps.gradle.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          java -version 2> ci-artifacts/java-version.log
          grep -Eq 'version "17[.]' ci-artifacts/java-version.log
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +e
          yes 2>/dev/null | "$SDKMANAGER" --licenses > ci-artifacts/sdk-licenses.log 2>&1
          license_status=${PIPESTATUS[1]}
          set -e
          test "$license_status" -eq 0
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1" 2>&1 | tee ci-artifacts/sdk-install.log
          test -f "$SDK_DIR/platforms/android-36/source.properties"
          test -f "$SDK_DIR/ndk/26.1.10909125/source.properties"
          test -d "$SDK_DIR/cmake/3.22.1"
          test -x "$SDK_DIR/build-tools/35.0.0/apksigner"
          test -x "$SDK_DIR/build-tools/35.0.0/aapt2"
          grep -Eq '^AndroidVersion.ApiLevel[[:space:]]*=[[:space:]]*36[[:space:]]*$' "$SDK_DIR/platforms/android-36/source.properties"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*26[.]1[.]10909125[[:space:]]*$' "$SDK_DIR/ndk/26.1.10909125/source.properties"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*35[.]0[.]0[[:space:]]*$' "$SDK_DIR/build-tools/35.0.0/source.properties"
          "$SDK_DIR/cmake/3.22.1/bin/cmake" --version > ci-artifacts/cmake-version.log
          grep -Eq '^cmake version 3[.]22[.]1([-+][^[:space:]]*)?[[:space:]]*$' ci-artifacts/cmake-version.log
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          chmod +x gradlew

      - name: Prepare existing signing configuration
        id: signing
        if: ${{ !cancelled() && steps.android.outcome == 'success' }}
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 .github/scripts/android_ci.py signing

      - name: Compile Kotlin, Java and resources before downstream checks
        id: compile
        if: ${{ !cancelled() && steps.signing.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ vars.LISTEN_TOGETHER_SERVER || secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileReleaseKotlin \
            :app:compileDebugJavaWithJavac :app:compileReleaseJavaWithJavac \
            :app:processDebugResources :app:processReleaseResources \
            --init-script .github/scripts/task-inputs.gradle --continue --build-cache --console=plain \
            --stacktrace --no-daemon --no-configuration-cache --max-workers=2 2>&1 | tee ci-artifacts/compile.log

      # Continue only to collect all available diagnostics. Mandatory gate below
      # uses outcome (not the success conclusion of continue-on-error).
      - name: Android Lint (debug and release)
        id: lint
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ vars.LISTEN_TOGETHER_SERVER || secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug :app:lintRelease --init-script .github/scripts/task-inputs.gradle --continue --build-cache --console=plain \
            --stacktrace --no-daemon --no-configuration-cache --max-workers=2 2>&1 | tee ci-artifacts/lint.log

      - name: Unit tests (debug and release)
        id: tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ vars.LISTEN_TOGETHER_SERVER || secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest --init-script .github/scripts/task-inputs.gradle --continue --build-cache --console=plain \
            --stacktrace --no-daemon --no-configuration-cache --max-workers=2 2>&1 | tee ci-artifacts/tests.log

      - name: Build APKs (debug and release)
        id: build
        if: ${{ !cancelled() && steps.compile.outcome == 'success' && steps.lint.outcome == 'success' && steps.tests.outcome == 'success' }}
        continue-on-error: true
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ vars.LISTEN_TOGETHER_SERVER || secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --init-script .github/scripts/task-inputs.gradle --continue --build-cache --console=plain \
            --stacktrace --no-daemon --no-configuration-cache --max-workers=2 2>&1 | tee ci-artifacts/build.log

      - name: Verify APK signatures, identity, ZIP, native architecture and notices
        id: verify
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: python3 .github/scripts/android_ci.py verify

      - name: Remove temporary private keystore
        id: cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/aurelis-ci-release.jks"

      - name: Generate honest task/source/diagnostic report
        id: report
        if: always()
        continue-on-error: true
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LISTEN_TOGETHER_SERVER: ${{ vars.LISTEN_TOGETHER_SERVER || secrets.LISTEN_TOGETHER_SERVER }}
        run: python3 .github/scripts/android_ci.py report --annotations

      - name: Upload reports and redacted logs
        id: upload_report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: compilation-report-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs only after all checks pass
        id: upload_apk
        if: ${{ !cancelled() && steps.init.outcome == 'success' && steps.helpers.outcome == 'success' && steps.java.outcome == 'success' && steps.gradle.outcome == 'success' && steps.android.outcome == 'success' && steps.signing.outcome == 'success' && steps.compile.outcome == 'success' && steps.lint.outcome == 'success' && steps.tests.outcome == 'success' && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.report.outcome == 'success' && steps.upload_report.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: Aurelis Music-${{ github.run_number }}
          path: ci-approved-apks/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce required outcomes (failure/skipped is not success)
        if: always()
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 .github/scripts/android_ci.py gate
