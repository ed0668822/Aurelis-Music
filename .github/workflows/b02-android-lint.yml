name: "B02 | Android Lint"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b02-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-lint:
    name: "B02 | Lint + isolated diagnostics"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Create diagnostics directory
        run: mkdir -p ci-b02

      - name: Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Android SDK dependencies
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > ci-b02/sdk-install.log 2>&1 || {
            cat ci-b02/sdk-install.log
            exit 1
          }
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          chmod +x gradlew

      - name: Run Android Lint Debug
        id: lint
        continue-on-error: true
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug :app:lintRelease --init-script .github/scripts/task-inputs.gradle --continue --build-cache --console=plain \
            --stacktrace --no-daemon --no-configuration-cache --max-workers=2 \
            2>&1 | tee ci-b02/lint.log

      - name: Summarize Android Lint issues
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          python3 - <<'PY'
          import collections
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          out = Path("ci-b02")
          out.mkdir(exist_ok=True)
          xml = Path("app/build/reports/lint-results-debug.xml")
          issues = []
          error = ""
          if xml.exists():
              try:
                  root = ET.parse(xml).getroot()
                  for issue in root.findall("issue"):
                      location = issue.find("location")
                      issues.append({
                          "severity": issue.get("severity", "Unknown"),
                          "id": issue.get("id", "Unknown"),
                          "message": issue.get("message", ""),
                          "file": location.get("file", "") if location is not None else "",
                          "line": location.get("line", "") if location is not None else "",
                      })
              except ET.ParseError as exc:
                  error = f"Lint XML parse failure: {exc}"
          else:
              error = "Lint XML was not generated (see lint.log)"
          with (out / "issues.tsv").open("w", encoding="utf-8") as fp:
              fp.write("severity\tid\tfile\tline\tmessage\n")
              for issue in issues:
                  vals = [issue[k] for k in ("severity", "id", "file", "line", "message")]
                  fp.write("\t".join(str(v).replace("\t", " ").replace("\n", " ") for v in vals) + "\n")
          counts = collections.Counter(i["severity"] for i in issues)
          state = os.getenv("LINT_OUTCOME", "not_started")
          lines = [
              "# B02 — Android Lint",
              f"- Gradle status: **{state}**",
              f"- XML report: **{'present' if xml.exists() else 'missing'}**",
              f"- Total issues: **{len(issues)}**",
              f"- Error: **{counts['Error'] + counts['Fatal']}**",
              f"- Warning: **{counts['Warning']}**",
              f"- Information: **{counts['Information']}**",
              "- Findings are static-analysis results, not proof of APK runtime behavior.",
              f"- Diagnostic: {error}" if error else "- Diagnostics: `lint.log`, `issues.tsv`",
          ]
          (out / "summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as fp:
              fp.write("\n".join(lines) + "\n")
          if xml.exists():
              (out / "lint-results-debug.xml").write_bytes(xml.read_bytes())
          rel = Path("app/build/reports/lint-results-release.xml")
          if rel.exists():
              (out / "lint-results-release.xml").write_bytes(rel.read_bytes())
          PY

      - name: Upload B02 Lint report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: b02-lint-report-${{ github.run_number }}
          path: ci-b02/
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce lint outcome
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          test "$LINT_OUTCOME" = success
          test -s ci-b02/lint-results-debug.xml
          test -s ci-b02/lint-results-release.xml
