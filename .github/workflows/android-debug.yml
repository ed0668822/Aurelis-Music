name: Android · Prueba (debug)

# Build de PRUEBA: APK dev/debug sin firma de producción. No necesita keystore ni
# secrets de firma: AGP genera una clave de depuración propia.
on:
  push:
    branches: [Aurelis-Music-Redesign]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dev APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Las claves de Last.fm y Listen Together son opcionales: si no existen
      # como secrets del repo quedan vacías y la app compila igual.
      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      - run: chmod +x gradlew

      # Un solo APK (arm64-v8a, el de casi todos los móviles actuales). Sin esto
      # salen cuatro APKs (tres arquitecturas + universal) y el artefacto pasa
      # de 470 MB. El módulo del reloj ya no existe aquí, así que no se empaqueta.
      - name: Build the dev APK
        run: ./gradlew assembleDevDebug -Pbitchord.abis=arm64-v8a -Pbitchord.bundleWear=false

      - name: APK size report
        run: |
          cd app/build/outputs/apk/dev/debug
          ls -l --block-size=M *.apk
          echo "APKs generados: $(ls *.apk | wc -l)"
          for APK in *.apk; do
            echo "=== $APK: contenido por tamaño comprimido ==="
            unzip -lv "$APK" | awk 'NR>3 && $1 ~ /^[0-9]+$/ && $8 != "" {printf "%d %s\n", $3, $8}' > /tmp/entries.txt
            awk '{n=split($2,p,"/"); g=(p[1]=="lib" && n>1)?"lib/"p[2]:((p[1] ~ /^classes/)?"dex":p[1]); s[g]+=$1} END {for (g in s) printf "%7.1f MB  %s\n", s[g]/1048576, g}' /tmp/entries.txt | sort -rn
            echo "--- 15 archivos más pesados ---"
            sort -rn /tmp/entries.txt | head -15 | awk '{printf "%7.1f MB  %s\n", $1/1048576, $2}'
          done

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelis-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
