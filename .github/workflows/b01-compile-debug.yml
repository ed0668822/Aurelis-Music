# B01: reusable Debug compilation stage; feature pushes are owned by B06.
# Keep workflow_call for B06 and publish verified APKs only in B04.
# Reconciled with the standalone main workflow without restoring duplicate APK uploads.
name: "B01 | Compile Debug APK"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b01-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-apk:
    name: "B01 | APK Debug + report"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p ci-b01

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper and cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true
          cache-read-only: true

      - name: Restore pinned-version Android SDK cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
            ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-v1-${{ runner.os }}-api36-bt35-ndk26.1.10909125-cmake3.22.1

      - name: Install required Android SDK tools
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > ci-b01/sdk-install.log 2>&1 || {
            cat ci-b01/sdk-install.log
            exit 1
          }
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          chmod +x gradlew

      - name: Compile and assemble Debug APK
        id: compile
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --init-script .github/scripts/task-inputs.gradle --build-cache --console=plain \
            --stacktrace --no-daemon --no-configuration-cache --max-workers=2 \
            2>&1 | tee ci-b01/gradle-build.log

      - name: Build Debug instrumentation APK (same source as Debug APK)
        id: p3_build
        timeout-minutes: 25
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebugAndroidTest --init-script .github/scripts/task-inputs.gradle --build-cache --console=plain \
            --stacktrace --no-daemon --no-configuration-cache --max-workers=2 \
            2>&1 | tee ci-b01/p3-androidtest-build.log
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Verify and package signed-for-debug APK handoff
        id: handoff
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_ci14_handoff.py' -v
          python3 .github/scripts/ci14_handoff.py pack
          python3 .github/scripts/ci14_handoff.py verify

      - name: Upload same-run APK handoff
        id: shared
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: b01-shared-apks-${{ github.run_number }}
          path: ci-f3-handoff/
          if-no-files-found: error
          retention-days: 2

      - name: Generate independent B01 report
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
          P3_BUILD_OUTCOME: ${{ steps.p3_build.outcome }}
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
          SHARED_OUTCOME: ${{ steps.shared.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re
          import zipfile

          report = pathlib.Path("ci-b01")
          report.mkdir(exist_ok=True)
          log = report / "gradle-build.log"
          contents = log.read_text(errors="replace") if log.exists() else ""
          tasks = re.findall(r"^> Task (\S+)(.*)$", contents, re.MULTILINE)
          apks = sorted(pathlib.Path("app/build/outputs/apk/debug").glob("*.apk"))
          with (report / "gradle-tasks.tsv").open("w") as fp:
              fp.write("task\tstatus\n")
              for task, detail in tasks:
                  fp.write(f"{task}\t{detail.strip() or 'EXECUTED'}\n")
          with (report / "apk-manifest.tsv").open("w") as fp:
              fp.write("filename\tbytes\tsha256\tzip_valid\n")
              for apk in apks:
                  digest = hashlib.sha256(apk.read_bytes()).hexdigest()
                  with zipfile.ZipFile(apk) as z:
                      valid = z.testzip() is None
                  fp.write(f"{apk.name}\t{apk.stat().st_size}\t{digest}\t{valid}\n")
          status = os.environ.get("BUILD_OUTCOME", "not_started")
          summary = [
              "# B01 — Debug APK compilation",
              f"- Status: **{status}**",
              f"- Instrumentation APK built: **{os.getenv('P3_BUILD_OUTCOME', 'unknown')}**",
              f"- SHA-256 provenance verified: **{os.getenv('HANDOFF_OUTCOME', 'unknown')}**",
              f"- Immutable shared artifact uploaded: **{os.getenv('SHARED_OUTCOME', 'unknown')}**",
              f"- Commit: `{os.environ.get('GITHUB_SHA', 'unknown')}`",
              f"- Gradle task lines captured: **{len(tasks)}**",
              f"- Debug APKs found: **{len(apks)}**",
              "- Task inventory lists executed/skipped Gradle tasks, not an exact per-source-file compiler list.",
              "- Detailed diagnostics: `gradle-build.log`.",
              "- APK metadata: `apk-manifest.tsv`.",
          ]
          (report / "summary.md").write_text("\n".join(summary) + "\n")
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as fp:
              fp.write("\n".join(summary) + "\n")
          PY

      - name: Upload B01 diagnostic report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: b01-report-${{ github.run_number }}
          path: ci-b01/
          if-no-files-found: warn
          retention-days: 30

# APK delivery belongs exclusively to B04, after independent verification.
