// Records configuration, declared inputs and terminal task outcomes, not per-file compilation.
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

gradle.projectsEvaluated {
    def root = gradle.rootProject.projectDir.canonicalFile.toPath()
    def manifest = root.resolve('ci-artifacts/source-inventory.json').toFile()
    def tracked = manifest.isFile() ? new JsonSlurper().parse(manifest).collect { it.path }.toSet() : [] as Set
    def emit = { prefix, data -> println prefix + ' ' + JsonOutput.toJson(data) }
    def relative = { file ->
        def absolute = file.canonicalFile.toPath()
        if (!absolute.startsWith(root)) return null
        def value = root.relativize(absolute).toString().replace(File.separator, '/')
        value.isEmpty() ? '.' : value
    }
    gradle.rootProject.allprojects.each { project ->
        def android = project.extensions.findByName('android')
        if (android == null) return
        try {
            android.sourceSets.each { set ->
                ['java', 'res', 'assets', 'jniLibs'].each { kind ->
                    set."${kind}".srcDirs.each { dir ->
                        def path = relative(dir)
                        if (path != null) emit('AURELIS_SOURCE_ROOT', [project: project.path, source_set: set.name, kind: kind, path: path])
                    }
                }
                def path = relative(set.manifest.srcFile)
                if (path != null) emit('AURELIS_SOURCE_ROOT', [project: project.path, source_set: set.name, kind: 'manifest', path: path])
            }
            def kotlin = project.extensions.findByName('kotlin')
            if (kotlin != null && kotlin.hasProperty('sourceSets')) {
                kotlin.sourceSets.each { set ->
                    set.kotlin.srcDirs.each { dir ->
                        def path = relative(dir)
                        if (path != null) emit('AURELIS_SOURCE_ROOT', [project: project.path, source_set: set.name, kind: 'kotlin', path: path])
                    }
                }
            }
        } catch (Exception ignored) {
            emit('AURELIS_INPUT_ERROR', [task: project.path + ':sourceSets', message: 'Could not inspect declared source roots'])
        }
    }
    def selected = { task -> task.name ==~ /(?:compile.*(?:Kotlin|JavaWithJavac|Shaders)|(?:merge|process).*(?:Resources|Assets|Manifest)|(?:merge|strip).*NativeLibs|(?:build|configure)CMake.*)/ }
    gradle.taskGraph.beforeTask { task ->
        if (!selected(task)) return
        try {
            task.inputs.files.files.each { file ->
                def path = relative(file)
                if (path == null) return
                def generated = path.contains('/build/generated/') && path ==~ /.*\.(?:kt|java|xml|c|cc|cpp|h|hpp)$/
                if (file.isFile() && (tracked.contains(path) || generated)) {
                    emit('AURELIS_TASK_INPUT', [task: task.path, path: path, origin: tracked.contains(path) ? 'tracked' : 'generated'])
                } else if (file.isDirectory()) {
                    // Expand only tracked descendants. Never recursively scan dependency caches or build outputs.
                    def prefix = path == '.' ? '' : path + '/'
                    tracked.findAll { it.startsWith(prefix) }.each { child ->
                        def candidate = root.resolve(child).toFile()
                        def actual = relative(candidate)
                        if (candidate.isFile() && actual == child) emit('AURELIS_TASK_INPUT', [task: task.path, path: child, origin: 'tracked-directory-input'])
                    }
                }
            }
        } catch (Exception ignored) {
            emit('AURELIS_INPUT_ERROR', [task: task.path, message: 'Could not inspect declared task inputs'])
        }
    }
    gradle.taskGraph.afterTask { task, state ->
        if (!selected(task)) return
        def message = state.skipMessage
        def outcome = state.failure != null ? 'FAILED' : state.noSource ? 'NO-SOURCE' :
            message == 'FROM-CACHE' ? 'FROM-CACHE' : state.upToDate ? 'UP-TO-DATE' : state.skipped ? 'SKIPPED' : 'SUCCESS'
        emit('AURELIS_TASK_RESULT', [task: task.path, state: outcome])
    }
}
