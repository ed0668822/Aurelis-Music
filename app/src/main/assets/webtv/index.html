<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurelis Music TV — Browser Receiver</title>
<style>
:root{font-family:Arial,sans-serif;color:#fff;background:#111018}*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:linear-gradient(145deg,#272035,#15111f 70%,#0c0b12);padding:4vh 5vw;display:flex;flex-direction:column}
header{font-weight:700;letter-spacing:.19em;color:#ffc4d2;font-size:clamp(18px,1.6vw,30px)}
main{flex:1;min-height:0;display:grid;grid-template-columns:30% 1fr;gap:5vw;align-items:center}
.cover{width:100%;aspect-ratio:1;max-height:50vh;border-radius:2vw;background:linear-gradient(125deg,#752c60,#241d44);box-shadow:0 3vw 6vw #0009;overflow:hidden;display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;display:none}.cover span{font-size:12vw;color:#ffffff50}
.playback{min-width:0;max-height:70vh}h1{font-size:clamp(28px,3.7vw,76px);margin:.1em 0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:clamp(17px,1.8vw,38px);color:#cbc5d3;margin:.2em 0 1em}
.lyrics{height:34vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden;gap:1.4vh}
.line{font-size:clamp(24px,2.6vw,54px);font-weight:700;line-height:1.2;color:#b5abbf;opacity:.4;overflow-wrap:anywhere}
.line.active{color:#fff;opacity:1}.line .word{color:#aea4b8;background:linear-gradient(90deg,#fff var(--fill,0%),#aba2b6 var(--fill,0%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
button{background:#fa8dad;border:0;color:#170e19;border-radius:100px;padding:1vh 2.4vw;font-size:clamp(18px,1.6vw,32px);font-weight:700;cursor:pointer}
button:focus-visible{outline:4px solid #fff;outline-offset:5px}
.controls{display:flex;gap:1.3vw;align-items:center;padding-top:1.5vh}#status{color:#c4b9ca;font-size:clamp(15px,1.1vw,23px)}
footer{display:flex;gap:1.6vw;align-items:center;color:#ded7e6}audio{width:35vw;max-width:550px;min-height:40px}
@media(max-aspect-ratio:1){main{grid-template-columns:1fr}.cover{width:20vh;max-height:20vh;margin:auto}body{padding:3vh 5vw}.lyrics{height:26vh}.line{font-size:4vw}}
</style>
</head>
<body>
<header>♪ AURELIS MUSIC <span style="opacity:.5;font-weight:400">· TV</span></header>
<main>
 <div class="cover"><img id="cover" alt="Album cover"><span id="placeholder">♫</span></div>
 <section class="playback">
  <h1 id="title">Aurelis Music</h1><p class="artist" id="artist">Open the player on your phone</p>
  <div id="lyrics" class="lyrics" aria-live="off">Lyrics will appear here</div>
  <div class="controls"><button id="play" type="button">▶ Play on TV</button><span id="status">Waiting for music</span></div>
 </section>
</main>
<footer><audio id="audio" controls preload="metadata"></audio><span id="time">0:00 / 0:00</span></footer>
<script>
(function(){
'use strict';
var audio=document.getElementById('audio'),play=document.getElementById('play');
var title=document.getElementById('title'),artist=document.getElementById('artist'),cover=document.getElementById('cover');
var placeholder=document.getElementById('placeholder'),lyrics=document.getElementById('lyrics');
var status=document.getElementById('status'),time=document.getElementById('time');
var id='',currentUrl='',seq=-1,revision=-1,lines=[],offset=0,lineIndexCache=-99,wordNodes=[];
var suppressPauseUntil=0,networkFailures=0;
var started=false;
function fmt(s){s=isFinite(s)&&s>0?Math.floor(s):0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function send(action){if(!id)return;fetch('event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,action:action,positionMs:Math.floor((audio.currentTime||0)*1000)}),cache:'no-store'}).catch(function(){})}
function textNode(text){return document.createTextNode(text)}
function makeLine(line,active){
 var row=document.createElement('div');row.className='line'+(active?' active':'');
 var content=String(line.x||''),words=Array.isArray(line.w)?line.w:[];
 if(!active||!words.length){row.textContent=content||'♪';return row;}
 var offsetText=0;
 words.forEach(function(w){
   if(!Array.isArray(w)||typeof w[2]!=='string'||!w[2])return;
   var found=content.indexOf(w[2],offsetText);if(found<offsetText)return;
   if(found>offsetText)row.appendChild(textNode(content.slice(offsetText,found)));
   var span=document.createElement('span');span.className='word';span.textContent=w[2];row.appendChild(span);
   wordNodes.push({node:span,from:Number(w[0]),to:Number(w[1])});
   offsetText=found+w[2].length;
 });
 if(offsetText<content.length)row.appendChild(textNode(content.slice(offsetText)));
 return row;
}
function render(){
 if(!lines.length){if(lineIndexCache!==-100){lyrics.textContent='No synchronized lyrics available';lineIndexCache=-100;}return;}
 var ms=Math.max(0,(audio.currentTime||0)*1000-offset);
 var low=0,high=lines.length-1,idx=-1;
 while(low<=high){var mid=(low+high)>>1;if(Number(lines[mid].t)<=ms){idx=mid;low=mid+1;}else high=mid-1;}
 if(idx!==lineIndexCache){
  lineIndexCache=idx;wordNodes=[];
  var fragment=document.createDocumentFragment(),first=Math.max(0,idx-2),last=Math.min(lines.length-1,Math.max(idx+2,2));
  for(var i=first;i<=last;i++)fragment.appendChild(makeLine(lines[i],i===idx));
  lyrics.replaceChildren(fragment);
 }
 wordNodes.forEach(function(w){
  var length=Math.max(1,w.to-w.from),progress=Math.max(0,Math.min(100,(ms-w.from)/length*100));
  w.node.style.setProperty('--fill',progress.toFixed(1)+'%');
 });
}
function syncLyrics(nextId,nextRevision){
 if(nextRevision===revision)return;
 revision=nextRevision;lines=[];lineIndexCache=-99;lyrics.textContent='Loading lyrics…';
 fetch('lyrics',{cache:'no-store'}).then(function(r){return r.json()}).then(function(data){
  if(data.id!==id||data.revision!==revision)return;
  var incoming=[];
  (data.packets||[]).forEach(function(p){(p.lines||[]).forEach(function(l){if(typeof l.t==='number'&&typeof l.x==='string')incoming.push(l)})});
  incoming.sort(function(a,b){return a.t-b.t});
  lines=incoming;offset=(data.packets&&data.packets[0]?data.packets[0].offsetMs:0)||0;
  lineIndexCache=-99;render();
 }).catch(function(){lyrics.textContent='Lyrics unavailable'});
}
function state(){
 fetch('state',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('unreachable');return r.json()}).then(function(data){
   networkFailures=0;
   var next=String(data.id||''),url=String(data.url||'');
   if(next!==id||url!==currentUrl){
     var keepPlaying=started&&(data.playing||!audio.paused);
     id=next;currentUrl=url;revision=-1;lines=[];lineIndexCache=-99;lyrics.textContent='Loading lyrics…';
     suppressPauseUntil=Date.now()+1500;
     audio.pause();audio.removeAttribute('src');audio.load();started=keepPlaying;
     if(url){audio.src=url;audio.load();if(keepPlaying)audio.play().catch(function(){});}
   }
   title.textContent=data.title||'Aurelis Music';artist.textContent=data.artist||'Connect from your phone';
   if(data.artwork&&/^https?:\/\//.test(data.artwork)){
     if(cover.getAttribute('src')!==data.artwork){cover.src=data.artwork;cover.style.display='block';placeholder.style.display='none'}
   }else{cover.style.display='none';placeholder.style.display='block'}
   if(data.lyricRevision!==undefined)syncLyrics(id,data.lyricRevision);
   if(data.commandSeq!==seq){
     seq=data.commandSeq;
     if(data.command==='play'&&started)audio.play().catch(function(){});
     if(data.command==='pause')audio.pause();
     if(data.command==='seek'&&started)audio.currentTime=(Number(data.commandPosition)||0)/1000;
     if(data.command==='load'&&started&&url)audio.play().catch(function(){});
   }
   status.textContent=url?(started?(audio.paused?'Paused':'Playing on TV'):'Press Play on TV'):'Waiting for a compatible track';
   play.textContent=audio.paused?'▶ Play on TV':'Ⅱ Pause';
 }).catch(function(){
   networkFailures++;
   status.textContent='Connection to phone lost';
   if(networkFailures>=3&&!audio.paused){
     suppressPauseUntil=Date.now()+1500;
     audio.pause();
   }
 });
}
play.addEventListener('click',function(){
 if(!currentUrl)return;
 if(audio.paused){started=true;audio.play().catch(function(){status.textContent='Cannot play this audio format'})}
 else audio.pause();
});
audio.addEventListener('playing',function(){started=true;send('playing');play.textContent='Ⅱ Pause'});
audio.addEventListener('pause',function(){if(started&&Date.now()>suppressPauseUntil){send('paused');play.textContent='▶ Play on TV'}});
audio.addEventListener('ended',function(){send('ended')});
audio.addEventListener('seeked',function(){if(started)send(audio.paused?'paused':'playing')});
setInterval(function(){if(started&&!audio.paused)send('progress');render();time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)},950);
setInterval(state,750);state();render();
})();
</script>
</body>
</html>
